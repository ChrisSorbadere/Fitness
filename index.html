<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fitness 57</title>
<meta name="description" content="Coach personnel mobilité, renforcement, cardio et nutrition.">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0FA2B6">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <header class="top">
    <img class="app-icon" src="icon-192.png" alt="">
    <div class="htext">
      <div class="eyebrow" id="hdr-date"></div>
      <h1 id="hdr-title">Fitness 57 <span class="version">v2.2</span></h1>
    </div>
    <button class="icon-btn" id="btn-settings" aria-label="Réglages">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </header>

  <main id="view"></main>

  <nav class="bottom-nav" id="bottom-nav">
    <button data-view="home" class="active"><span class="ni">🏠</span><span>Accueil</span></button>
    <button data-view="seances"><span class="ni">🏋️</span><span>Séances</span></button>
    <button data-view="nutrition"><span class="ni">🥗</span><span>Nutrition</span></button>
    <button data-view="progres"><span class="ni">📈</span><span>Progrès</span></button>
  </nav>
</div>

<!-- Lecteur de séance guidée (plein écran) -->
<div class="player" id="player" hidden></div>

<!-- Feuille modale (détail exercice, tests, réglages…) -->
<div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true"></div>

<div class="toast" id="toast"></div>
<canvas id="confetti" aria-hidden="true"></canvas>

<script src="images.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
